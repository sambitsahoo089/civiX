# Render Blueprint — provisions the CiviX web service with the right build
# command, health check, and environment variables. Deploy via
# "New +" → "Blueprint" in the Render dashboard, or it is picked up
# automatically when you connect the repo.
services:
  - type: web
    name: civix
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # paste your MongoDB Atlas SRV connection string in the dashboard
      - key: MONGODB_DB
        value: civix
      - key: AUTH_SECRET
        generateValue: true # Render generates a strong random secret on first deploy
      - key: AUTH_TRUST_HOST
        value: "true"
      # REQUIRED in production: your public site URL. Without it Auth.js can fall
      # back to http://localhost:3000 when building redirect URLs behind Render's
      # proxy (symptom: refreshing a page bounces the browser to localhost).
      - key: AUTH_URL
        sync: false # e.g. https://civix-xxxx.onrender.com
      # Email delivery for emergency alerts — Gmail App Password works:
      # https://myaccount.google.com/apppasswords (2FA required on the account)
      # - key: SMTP_USER
      #   sync: false # e.g. comedydedanadan089@gmail.com
      # - key: SMTP_PASS
      #   sync: false # 16-character App Password, not the login password
      # Optional overrides:
      # - key: ALERT_EMAIL_TO
      #   sync: false # defaults to the helpline email
      # Optional SMS gateway webhook:
      # - key: ALERT_SMS_WEBHOOK_URL
      #   sync: false
      # - key: BLOB_READ_WRITE_TOKEN
      #   sync: false
